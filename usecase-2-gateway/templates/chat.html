<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reinvent Demo — Use Case 2</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Reinvent Demo — Use Case 2 (Gateway / Fallback)</h1>
            <p class="muted">Gateway-enabled Bedrock or direct fallback. Tool results are shown as rich cards.</p>
        </header>

        <main class="chat-panel">
            <div id="messages" class="messages"></div>

            <form id="chatForm" class="chat-form">
                <input id="messageInput" placeholder="Ask the agent (e.g. 'fetch data from api2')" autocomplete="off" />
                <button type="submit">Send</button>
            </form>
        </main>
    </div>

    <script>
    async function postMessage(text){
        const res = await fetch('/api/chat', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
        return res.json();
    }

    function appendMessage(role, html){
        const container = document.getElementById('messages');
        const el = document.createElement('div');
        el.className = 'msg ' + role;
        el.innerHTML = html;
        container.appendChild(el);
        container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chatForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if(!text) return;
        appendMessage('user', '<strong>You:</strong> ' + text);
        input.value = '';
        const r = await postMessage(text);
        if(r.error){
            appendMessage('assistant','<strong>Error:</strong> '+ r.error);
        } else {
            appendMessage('assistant','<strong>Agent:</strong> ' + (r.response || 'No response'));
            if(r.tools_used && r.tools_used.length){
                const toolsHtml = r.tools_used.map(t=>`<div class=\"tool\"><div class=\"tool-name\">${t.name}</div><div class=\"tool-url\">${t.url}</div></div>`).join('');
                appendMessage('assistant', '<div class=\"tools\"><h4>Tools called</h4>'+toolsHtml+'</div>');
            }

            if(r._tool_results && Array.isArray(r._tool_results)){
                r._tool_results.forEach(tr => {
                    if(tr.parsed){
                        const p = tr.parsed;
                        const card = `
                            <div class=\"tool-card\">\n                <div class=\"card-row\"><strong>Backend:</strong> ${p.backend_service || 'n/a'}</div>\n                <div class=\"card-row\"><strong>Traefik:</strong> ${p.traefik_version || 'n/a'}</div>\n                <div class=\"card-row\"><strong>mTLS:</strong> ${p.mtls ? 'yes' : 'no'}</div>\n                <div class=\"card-row\"><strong>Headers:</strong> ${p.custom_headers_count || 'n/a'}</div>\n                <div class=\"card-row\"><strong>Proxies:</strong> ${p.proxy_ips || 'n/a'}</div>\n                <div class=\"card-row\"><strong>Summary:</strong> ${p.summary || ''}</div>\n              </div>`;
                        appendMessage('assistant', card);
                    }
                });
            }
        }
    });
    </script>
</body>
</html>
